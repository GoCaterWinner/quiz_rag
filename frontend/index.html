<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz RAG Answer</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f8fafc;
      --line: #dbe4ef;
      --text: #172033;
      --muted: #6b7280;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #16a34a;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(1180px, calc(100vw - 40px));
      margin: 42px auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .title {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      min-width: 112px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
      font-size: 13px;
      text-align: center;
    }

    .status.active {
      color: var(--blue);
      border-color: #bfdbfe;
      background: #eff6ff;
    }

    .status.done {
      color: var(--green);
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .status.error {
      color: var(--red);
      border-color: #fecaca;
      background: #fef2f2;
    }

    .workspace {
      min-height: 650px;
      border: 2px solid var(--blue);
      display: grid;
      grid-template-columns: 260px 1fr;
      background: #fff;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .button {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
    }

    .button:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    .button.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      font-weight: 700;
    }

    .button.primary:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .file-meta {
      min-height: 40px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-all;
    }

    .content {
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(320px, 1fr);
      gap: 24px;
    }

    .panel {
      min-width: 0;
    }

    .preview-box,
    .result-box {
      height: 420px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .preview-box {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-placeholder {
      color: var(--muted);
      font-size: 14px;
    }

    .preview-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #fff;
    }

    .result-box {
      padding: 18px;
      overflow: auto;
    }

    .result-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .field:last-child {
      border-bottom: 0;
    }

    .label {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .value {
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .raw-json {
      margin: 18px 0 0;
      padding: 14px;
      border-radius: 8px;
      background: #111827;
      color: #e5e7eb;
      font-size: 12px;
      line-height: 1.6;
      overflow: auto;
    }

    .answer-value {
      color: var(--green);
      font-size: 20px;
      font-weight: 700;
    }

    .match-list {
      display: grid;
      gap: 10px;
    }

    .match-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .match-meta {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .page {
        width: min(100vw - 24px, 720px);
        margin: 24px auto;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1 class="title">截图答题</h1>
        <p class="subtitle">上传题目截图，后端会识别题干并从知识库检索答案。</p>
      </div>
      <div id="status" class="status">待上传</div>
    </header>

    <section class="workspace">
      <aside class="sidebar">
        <div>
          <h2 class="section-title">文件</h2>
          <p class="subtitle">选择一张截图后开始检索。</p>
        </div>

        <input id="imageInput" class="file-input" type="file" accept="image/*">
        <button id="chooseButton" class="button" type="button">选择文件</button>
        <button id="uploadButton" class="button primary" type="button" disabled>检索答案</button>

        <div id="fileMeta" class="file-meta">还没有选择图片。</div>
      </aside>

      <section class="content">
        <div class="panel">
          <h2 class="section-title">图片预览</h2>
          <div class="preview-box">
            <span id="previewPlaceholder" class="preview-placeholder">图片会显示在这里</span>
            <img id="previewImage" class="preview-image" alt="上传图片预览">
          </div>
        </div>

        <div class="panel">
          <h2 class="section-title">检索结果</h2>
          <div class="result-box">
            <div id="result" class="result-grid">
              <div class="preview-placeholder">等待检索结果。</div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const API_URL = "/api/answer";

    const imageInput = document.getElementById("imageInput");
    const chooseButton = document.getElementById("chooseButton");
    const uploadButton = document.getElementById("uploadButton");
    const fileMeta = document.getElementById("fileMeta");
    const previewImage = document.getElementById("previewImage");
    const previewPlaceholder = document.getElementById("previewPlaceholder");
    const result = document.getElementById("result");
    const status = document.getElementById("status");

    let selectedFile = null;

    function setStatus(text, state = "") {
      status.textContent = text;
      status.className = `status ${state}`.trim();
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatText(value, separator = "；") {
      if (Array.isArray(value)) {
        return value.join(separator);
      }

      return value || "";
    }

    function renderResult(data) {
      const answerData = data.answer_data || {};
      const query = answerData.query || "";
      const finalAnswer = formatText(answerData.final_answer);
      const matches = Array.isArray(answerData.matches) ? answerData.matches : [];
      const matchHTML = matches.length
        ? matches.map((match, index) => {
            const answer = formatText(match.answer);
            const confidence = Number.isFinite(match.confidence)
              ? match.confidence.toFixed(4)
              : "-";

            return `
              <div class="match-item">
                <div class="match-meta">#${index + 1} ${escapeHTML(match.id || "-")} · 相似度 ${escapeHTML(confidence)}</div>
                <div class="value">${escapeHTML(match.question || "-")}</div>
                <div class="label">答案</div>
                <div class="value">${escapeHTML(answer || "-")}</div>
              </div>
            `;
          }).join("")
        : '<div class="preview-placeholder">没有匹配到相似题目。</div>';

      result.innerHTML = `
        <div class="field">
          <div class="label">推荐答案</div>
          <div class="value answer-value">${escapeHTML(finalAnswer || "-")}</div>
        </div>
        <div class="field">
          <div class="label">识别题干</div>
          <div class="value">${escapeHTML(query || "-")}</div>
        </div>
        <div class="field">
          <div class="label">相似题目</div>
          <div class="match-list">${matchHTML}</div>
        </div>
        <pre class="raw-json">${escapeHTML(JSON.stringify(data, null, 2))}</pre>
      `;
    }

    chooseButton.addEventListener("click", () => {
      imageInput.click();
    });

    imageInput.addEventListener("change", () => {
      selectedFile = imageInput.files[0];

      if (!selectedFile) {
        uploadButton.disabled = true;
        fileMeta.textContent = "还没有选择图片。";
        previewImage.style.display = "none";
        previewPlaceholder.style.display = "inline";
        setStatus("待上传");
        return;
      }

      uploadButton.disabled = false;
      fileMeta.textContent = `${selectedFile.name}\n${Math.round(selectedFile.size / 1024)} KB`;
      previewImage.src = URL.createObjectURL(selectedFile);
      previewImage.style.display = "block";
      previewPlaceholder.style.display = "none";
      setStatus("已选择");
    });

    uploadButton.addEventListener("click", async () => {
      if (!selectedFile) {
        setStatus("未选择", "error");
        return;
      }

      const formData = new FormData();
      formData.append("file", selectedFile);

      uploadButton.disabled = true;
      setStatus("检索中", "active");
      result.innerHTML = '<div class="preview-placeholder">正在检索，请稍等。</div>';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error(`请求失败：${response.status}`);
        }

        const data = await response.json();
        renderResult(data);
        setStatus("完成", "done");
      } catch (error) {
        result.innerHTML = `<div class="value">检索失败：${escapeHTML(error.message)}</div>`;
        setStatus("失败", "error");
      } finally {
        uploadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
